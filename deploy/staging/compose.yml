name: ${COMPOSE_PROJECT_NAME:-ngv-odoo-mcp-staging}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [odoo16-db:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 160
    cpus: 1.0

  odoo16-init:
    image: odoo:16.0
    profiles: ["init"]
    restart: "no"
    command: ["odoo", "-d", "ngv_mcp_staging", "-i", "ngv_mcp_staging", "--without-demo=True", "--stop-after-init"]
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, odoo_full_password, odoo_crm_password, odoo_writer_password]
    volumes:
      - odoo16-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 256
    cpus: 1.5

  odoo16:
    image: odoo:16.0
    restart: unless-stopped
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - odoo16-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 256
    cpus: 1.5

  fixture-refresh:
    image: odoo:16.0
    profiles: ["test-data"]
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        export PGPASSWORD="$$(< /run/secrets/postgres_password)";
        exec odoo shell -d ngv_mcp_staging --no-http
        --db_host=db --db_port=5432 --db_user=odoo
        < /opt/tests/refresh_daily_fixture.py
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - odoo16-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./refresh_daily_fixture.py:/opt/tests/refresh_daily_fixture.py:ro
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 160
    cpus: 1.0

  oauth-stub:
    profiles: ["legacy-stub"]
    image: python:3.10-slim
    user: "65534:65534"
    restart: unless-stopped
    command: ["python", "/opt/oauth/oauth_stub.py"]
    environment:
      OAUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL}
      OAUTH_RESOURCE_URL: ${MCP_RESOURCE_URL}
      OAUTH_CLIENT_ID: ngv-odoo-mcp-staging
    secrets: [oauth_client_secret, oauth_full_token, oauth_crm_token]
    volumes:
      - ./oauth_stub.py:/opt/oauth/oauth_stub.py:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes: [keycloak-db:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 128
    cpus: 0.75

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/keycloak/bin/start-ngv-keycloak.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://${MCP_AUTH_PUBLIC_HOST}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xms256m -Xmx640m -XX:MaxRAMPercentage=70
    secrets: [keycloak_db_password, keycloak_admin_password]
    volumes:
      - ./keycloak_start.sh:/opt/keycloak/bin/start-ngv-keycloak.sh:ro
      - ./secrets/keycloak_realm.json:/opt/keycloak/data/import/ngv-mcp-staging-realm.json:ro
    networks:
      backend: {}
      proxy:
        aliases: [mcp-staging-keycloak]
    depends_on:
      keycloak-db: {condition: service_healthy}
    command: ["start", "--import-realm"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 8s
      start_period: 90s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 320
    cpus: 1.5

  gateway:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000", "--path", "/mcp", "--allow-remote-http"]
    environment:
      ODOO_CONFIG_FILE: /run/secrets/odoo_config
      ODOO_MCP_SECURITY_PROFILE: ngocviet-readonly
      ODOO_MCP_NGV_CLIENT_POLICY_FILE: /run/secrets/client_policy
      ODOO_MCP_AUDIT_LOG: /var/log/odoo-mcp/audit.jsonl
      ODOO_MCP_LOG_JSON: "1"
      ODOO_MCP_LOG_LEVEL: INFO
      ODOO_MCP_AUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL}
      ODOO_MCP_AUTH_INTROSPECTION_URL: ${MCP_AUTH_INTROSPECTION_URL}
      ODOO_MCP_AUTH_RESOURCE_URL: ${MCP_RESOURCE_URL}
      ODOO_MCP_AUTH_CLIENT_ID: ngv-odoo-mcp-staging
      ODOO_MCP_AUTH_CLIENT_SECRET_FILE: /run/secrets/oauth_client_secret
      ODOO_MCP_AUTH_REQUIRED_SCOPES: odoo.read
      ODOO_MCP_AUTH_IDENTITY_CLAIM: username
      ODOO_MCP_AUTH_REQUIRE_AUD: "1"
      ODOO_MCP_AUTH_REQUIRE_ISS: "1"
      ODOO_MCP_AUTH_CACHE_TTL: "0"
      MCP_ALLOWED_HOSTS: ${MCP_PUBLIC_HOST},127.0.0.1:*,localhost:*,gateway:8000
      MCP_ALLOWED_ORIGINS: https://${MCP_PUBLIC_HOST}
    secrets: [odoo_config, client_policy, oauth_client_secret]
    volumes: [gateway-audit:/var/log/odoo-mcp]
    ports: ["127.0.0.1:${MCP_BIND_PORT:-8765}:8000"]
    networks:
      backend: {}
      proxy:
        aliases: [mcp-staging-gateway]
    depends_on:
      odoo16: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"]
      interval: 15s
      timeout: 8s
      retries: 12

  gateway-write:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    restart: unless-stopped
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000", "--path", "/mcp", "--allow-remote-http"]
    environment:
      ODOO_CONFIG_FILE: /run/secrets/odoo_config
      ODOO_MCP_SECURITY_PROFILE: ngocviet-staging-write
      ODOO_MCP_NGV_WRITE_STAGE_ACK: I_UNDERSTAND_STAGING_ONLY
      ODOO_MCP_ENABLE_WRITES: "1"
      ODOO_MCP_NGV_CLIENT_POLICY_FILE: /run/secrets/client_policy
      ODOO_MCP_AUDIT_LOG: /var/log/odoo-mcp/audit.jsonl
      ODOO_MCP_LOG_JSON: "1"
      ODOO_MCP_LOG_LEVEL: INFO
      ODOO_MCP_AUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL}
      ODOO_MCP_AUTH_INTROSPECTION_URL: ${MCP_AUTH_INTROSPECTION_URL}
      ODOO_MCP_AUTH_RESOURCE_URL: ${MCP_WRITE_RESOURCE_URL}
      ODOO_MCP_AUTH_CLIENT_ID: ngv-odoo-mcp-staging
      ODOO_MCP_AUTH_CLIENT_SECRET_FILE: /run/secrets/oauth_client_secret
      ODOO_MCP_AUTH_REQUIRED_SCOPES: odoo.read,odoo.write.staging
      ODOO_MCP_AUTH_IDENTITY_CLAIM: username
      ODOO_MCP_AUTH_REQUIRE_AUD: "1"
      ODOO_MCP_AUTH_REQUIRE_ISS: "1"
      ODOO_MCP_AUTH_CACHE_TTL: "0"
      ODOO_MCP_NGV_HTTP_MAX_BODY_BYTES: "65536"
      ODOO_MCP_NGV_HTTP_TIMEOUT_SECONDS: "35"
      ODOO_MCP_HTTP_SESSION_IDLE_SECONDS: "300"
      ODOO_MCP_HTTP_MAX_SESSIONS: "64"
      ODOO_MCP_NGV_RATE_WINDOW_SECONDS: "60"
      ODOO_MCP_NGV_RATE_READ_MAX: "60"
      ODOO_MCP_NGV_RATE_PREPARE_MAX: "10"
      ODOO_MCP_NGV_RATE_EXECUTE_MAX: "5"
      ODOO_MCP_NGV_CONCURRENCY_READ: "2"
      ODOO_MCP_NGV_CONCURRENCY_WRITE: "1"
      ODOO_MCP_AUDIT_MAX_BYTES: "10485760"
      ODOO_MCP_AUDIT_BACKUP_COUNT: "14"
      MCP_ALLOWED_HOSTS: ${MCP_WRITE_PUBLIC_HOST},127.0.0.1:*,localhost:*,gateway-write:8000
      MCP_ALLOWED_ORIGINS: https://${MCP_WRITE_PUBLIC_HOST}
    secrets: [odoo_config, client_policy, oauth_client_secret]
    volumes: [gateway-write-audit:/var/log/odoo-mcp]
    networks: [backend]
    depends_on:
      odoo16: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"]
      interval: 15s
      timeout: 8s
      retries: 12

  smoke:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    profiles: ["test"]
    entrypoint: ["python"]
    command: ["/opt/tests/smoke_mcp.py"]
    environment:
      MCP_TEST_URL: http://gateway:8000/mcp
      MCP_AUTH_TOKEN_URL: ${MCP_AUTH_TOKEN_URL}
      MCP_AUTH_REVOCATION_URL: ${MCP_AUTH_REVOCATION_URL}
    secrets:
      - oauth_client_secret
      - keycloak_full_password
      - keycloak_crm_password
      - odoo_config
    volumes:
      - gateway-audit:/var/log/odoo-mcp:ro
      - ./smoke_mcp.py:/opt/tests/smoke_mcp.py:ro
    networks: [backend]
    depends_on:
      gateway: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: "no"

  oauth-smoke:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    profiles: ["test"]
    entrypoint: ["python"]
    command: ["/opt/tests/oauth_smoke.py"]
    environment:
      MCP_AUTH_TOKEN_URL: ${MCP_AUTH_TOKEN_URL}
      MCP_AUTH_INTROSPECTION_URL: ${MCP_AUTH_INTROSPECTION_URL}
      MCP_AUTH_REVOCATION_URL: ${MCP_AUTH_REVOCATION_URL}
      MCP_AUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL}
      MCP_WRITE_RESOURCE_URL: ${MCP_WRITE_RESOURCE_URL}
    secrets:
      - oauth_client_secret
      - keycloak_full_password
      - keycloak_crm_password
      - keycloak_writer_password
    volumes:
      - ./oauth_smoke.py:/opt/tests/oauth_smoke.py:ro
    networks: [backend]
    depends_on:
      keycloak: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: "no"

  keycloak-write-config:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    profiles: ["test"]
    entrypoint: ["python"]
    command: ["/opt/tests/configure_keycloak_write_client.py"]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      MCP_WRITE_RESOURCE_URL: ${MCP_WRITE_RESOURCE_URL}
      MCP_WRITE_OAUTH_REDIRECT_URI: http://127.0.0.1:8767/callback
    secrets: [keycloak_admin_password]
    volumes:
      - ./configure_keycloak_write_client.py:/opt/tests/configure_keycloak_write_client.py:ro
    networks: [backend]
    depends_on:
      keycloak: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: "no"

  pkce-smoke:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    profiles: ["test"]
    entrypoint: ["python"]
    command: ["/opt/tests/pkce_smoke.py"]
    environment:
      MCP_AUTH_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/ngv-mcp-staging
      MCP_WRITE_RESOURCE_URL: ${MCP_WRITE_RESOURCE_URL}
      MCP_WRITE_TEST_URL: http://gateway-write:8000/mcp
      MCP_WRITE_OAUTH_REDIRECT_URI: http://127.0.0.1:8767/callback
    secrets:
      - oauth_client_secret
      - keycloak_writer_password
    volumes:
      - ./pkce_smoke.py:/opt/tests/pkce_smoke.py:ro
    networks: [backend]
    depends_on:
      gateway-write: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: "no"

  write-smoke:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    profiles: ["test"]
    entrypoint: ["python"]
    command: ["/opt/tests/smoke_write.py"]
    environment:
      MCP_WRITE_TEST_URL: http://gateway-write:8000/mcp
      MCP_AUTH_TOKEN_URL: ${MCP_AUTH_TOKEN_URL}
      MCP_AUTH_REVOCATION_URL: ${MCP_AUTH_REVOCATION_URL}
    secrets:
      - oauth_client_secret
      - keycloak_full_password
      - keycloak_writer_password
      - odoo_config
    volumes:
      - gateway-write-audit:/var/log/odoo-mcp:ro
      - ./smoke_write.py:/opt/tests/smoke_write.py:ro
    networks: [backend]
    depends_on:
      gateway-write: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: "no"

  http-guard-smoke:
    image: ngv-odoo-mcp-staging:local
    group_add: ["${MCP_SECRET_GID:-1000}"]
    profiles: ["test"]
    entrypoint: ["python"]
    command: ["/opt/tests/smoke_http_guards.py"]
    environment:
      MCP_WRITE_TEST_URL: http://gateway-write:8000/mcp
      MCP_AUTH_TOKEN_URL: ${MCP_AUTH_TOKEN_URL}
    secrets:
      - oauth_client_secret
      - keycloak_writer_password
    volumes:
      - ./smoke_http_guards.py:/opt/tests/smoke_http_guards.py:ro
    networks: [backend]
    depends_on:
      gateway-write: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: "no"

networks:
  backend: {internal: true}
  edge: {}
  proxy:
    external: true
    name: nginx_network

volumes:
  odoo16-db: {}
  odoo16-data: {}
  gateway-audit: {}
  gateway-write-audit: {}
  keycloak-db: {}

secrets:
  postgres_password: {file: ./secrets/postgres_password.txt}
  odoo_config: {file: ./secrets/odoo_config.json}
  client_policy: {file: ./secrets/client_policy.json}
  oauth_client_secret: {file: ./secrets/oauth_client_secret.txt}
  oauth_full_token: {file: ./secrets/oauth_full_token.txt}
  oauth_crm_token: {file: ./secrets/oauth_crm_token.txt}
  odoo_full_password: {file: ./secrets/odoo_full_password.txt}
  odoo_crm_password: {file: ./secrets/odoo_crm_password.txt}
  odoo_writer_password: {file: ./secrets/odoo_writer_password.txt}
  keycloak_db_password: {file: ./secrets/keycloak_db_password.txt}
  keycloak_admin_password: {file: ./secrets/keycloak_admin_password.txt}
  keycloak_full_password: {file: ./secrets/keycloak_full_password.txt}
  keycloak_crm_password: {file: ./secrets/keycloak_crm_password.txt}
  keycloak_writer_password: {file: ./secrets/keycloak_writer_password.txt}

name: ${COMPOSE_PROJECT_NAME:-ngv-odoo-mcp-staging}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [odoo16-db:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 160
    cpus: 1.0

  odoo16-init:
    image: odoo:16.0
    profiles: ["init"]
    restart: "no"
    command: ["odoo", "-d", "ngv_mcp_staging", "-i", "ngv_mcp_staging", "--without-demo=True", "--stop-after-init"]
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, odoo_full_password, odoo_crm_password]
    volumes:
      - odoo16-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 256
    cpus: 1.5

  odoo16:
    image: odoo:16.0
    restart: unless-stopped
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - odoo16-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 256
    cpus: 1.5

  oauth-stub:
    image: python:3.10-slim
    user: "65534:65534"
    restart: unless-stopped
    command: ["python", "/opt/oauth/oauth_stub.py"]
    environment:
      OAUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL}
      OAUTH_RESOURCE_URL: ${MCP_RESOURCE_URL}
      OAUTH_CLIENT_ID: ngv-odoo-mcp-staging
    secrets: [oauth_client_secret, oauth_full_token, oauth_crm_token]
    volumes:
      - ./oauth_stub.py:/opt/oauth/oauth_stub.py:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    image: ngv-odoo-mcp-staging:local
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000", "--path", "/mcp", "--allow-remote-http"]
    environment:
      ODOO_CONFIG_FILE: /run/secrets/odoo_config
      ODOO_MCP_SECURITY_PROFILE: ngocviet-readonly
      ODOO_MCP_NGV_CLIENT_POLICY_FILE: /run/secrets/client_policy
      ODOO_MCP_AUDIT_LOG: /var/log/odoo-mcp/audit.jsonl
      ODOO_MCP_LOG_JSON: "1"
      ODOO_MCP_LOG_LEVEL: INFO
      ODOO_MCP_AUTH_ISSUER_URL: ${MCP_AUTH_ISSUER_URL}
      ODOO_MCP_AUTH_INTROSPECTION_URL: ${MCP_AUTH_INTROSPECTION_URL}
      ODOO_MCP_AUTH_RESOURCE_URL: ${MCP_RESOURCE_URL}
      ODOO_MCP_AUTH_CLIENT_ID: ngv-odoo-mcp-staging
      ODOO_MCP_AUTH_CLIENT_SECRET_FILE: /run/secrets/oauth_client_secret
      ODOO_MCP_AUTH_REQUIRED_SCOPES: odoo.read
      ODOO_MCP_AUTH_IDENTITY_CLAIM: sub
      ODOO_MCP_AUTH_REQUIRE_AUD: "1"
      ODOO_MCP_AUTH_REQUIRE_ISS: "1"
      ODOO_MCP_AUTH_CACHE_TTL: "15"
      MCP_ALLOWED_HOSTS: ${MCP_PUBLIC_HOST},127.0.0.1:*,localhost:*
      MCP_ALLOWED_ORIGINS: https://${MCP_PUBLIC_HOST}
    secrets: [odoo_config, client_policy, oauth_client_secret]
    volumes: [gateway-audit:/var/log/odoo-mcp]
    ports: ["127.0.0.1:${MCP_BIND_PORT:-8765}:8000"]
    networks: [backend, edge]
    depends_on:
      odoo16: {condition: service_healthy}
      oauth-stub: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"]
      interval: 15s
      timeout: 8s
      retries: 12

  smoke:
    image: ngv-odoo-mcp-staging:local
    profiles: ["test"]
    entrypoint: ["python"]
    command: ["/app/deploy/staging/smoke_mcp.py"]
    environment:
      MCP_TEST_URL: http://gateway:8000/mcp
    secrets: [oauth_full_token, oauth_crm_token, odoo_config]
    volumes: [gateway-audit:/var/log/odoo-mcp:ro]
    networks: [backend]
    depends_on:
      gateway: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    restart: "no"

networks:
  backend: {internal: true}
  edge: {}

volumes:
  odoo16-db: {}
  odoo16-data: {}
  gateway-audit: {}

secrets:
  postgres_password: {file: ./secrets/postgres_password.txt}
  odoo_config: {file: ./secrets/odoo_config.json}
  client_policy: {file: ./secrets/client_policy.json}
  oauth_client_secret: {file: ./secrets/oauth_client_secret.txt}
  oauth_full_token: {file: ./secrets/oauth_full_token.txt}
  oauth_crm_token: {file: ./secrets/oauth_crm_token.txt}
  odoo_full_password: {file: ./secrets/odoo_full_password.txt}
  odoo_crm_password: {file: ./secrets/odoo_crm_password.txt}
